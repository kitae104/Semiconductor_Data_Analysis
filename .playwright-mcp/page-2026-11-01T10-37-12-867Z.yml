            - listitem [ref=e91]: ▸ 불량은 빨리 찾을수록 덜 퍼진다. 오븐 하나가 이상하면 그날 구운 피자가 모두 영향을 받듯, 설비 하나의 문제는 여러 웨이퍼로 이어진다. 기록을 비교하면 "어디부터 봐야 하는지" 후보를 좁힐 수 있다.
            - listitem [ref=e92]: ▸ 전공이 달라도 숫자로 말해야 한다. 공정·설비·품질 어느 일을 하든 "불합격률이 20.0%입니다"처럼 데이터로 보고하는 힘이 필요하다. 이 과정은 코딩 경험이 없어도 따라올 수 있게 만들었다.
