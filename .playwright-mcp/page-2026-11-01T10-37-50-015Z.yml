          - heading "반도체 데이터 분석이란?" [level=2] [ref=f2e65]
          - paragraph [ref=f2e66]: 반도체 공장은 칩을 만드는 동안 온도·압력·검사 결과 같은 기록을 계속 남긴다. 반도체 데이터 분석은 그 기록을 표로 읽고, 불량이 어디서 늘었는지 찾아 줄이는 데 쓰는 일이다.
          - paragraph [ref=f2e67]: 피자 가게로 바꿔 말하면 이렇다. 점장이 판마다 적어 둔 오븐 번호·온도·손님 평가를 훑어보고 "덜 익었다는 말이 2번 오븐에서 유독 많네"를 찾아 고치는 일과 같다.
